name: Bug report
description: Report a reproducible problem with the crawler.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, cookies, private URLs, or other sensitive information.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the crawler mode and relevant options. Use a public or controlled test page.
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "e.g. v22.0.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant error output
      description: Redact secrets and personal information before posting.
